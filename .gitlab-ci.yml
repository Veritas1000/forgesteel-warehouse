stages:
  - test
  - build
  - publish

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v?[0-9]+[.][0-9]+([.][0-9]+)?$/

variables:
  TZ: America/New_York
  DOCKER_TLS_CERTDIR: "/certs"
  AST_ENABLE_MR_PIPELINES: true
  DOCKER_EXECUTOR_VERSION: '28' # testcontainers doesn't work with docker 29 yet, stick with 28
  DOCKER_PACKAGE_VERSION: '5:28.5.2-1~ubuntu.24.04~noble'
  DOCTL_VERSION: '1.148.0'

include:
- template: Jobs/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml
- template: Jobs/Dependency-Scanning.gitlab-ci.yml

.python_setup: &python_setup
  - apt-get update && apt-get upgrade -y && apt-get install -y locales ca-certificates curl
  - locale-gen en_US.UTF-8
  - export LANG="en_US.UTF-8"
  - export LANGUAGE="en_US.UTF-8"
  - export LC_ALL="en_US.UTF-8"
  - locale
  - apt-get install -y python3 python-is-python3 python3-pip python3-venv

.docker_setup: &docker_setup
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - |
    tee /etc/apt/sources.list.d/docker.sources <<EOF
    Types: deb
    URIs: https://download.docker.com/linux/ubuntu
    Suites: $(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}")
    Components: stable
    Signed-By: /etc/apt/keyrings/docker.asc
    EOF
  - apt-get update
  - apt list -a docker-ce
  - apt-get install -y docker-ce="${DOCKER_PACKAGE_VERSION}" docker-ce-cli="${DOCKER_PACKAGE_VERSION}" containerd.io docker-buildx-plugin docker-compose-plugin
  - nohup dockerd >/dev/null 2>&1 &
  - docker --version

.doctl_setup: &doctl_setup
  - curl -Lo doctl.tar.gz "https://github.com/digitalocean/doctl/releases/download/v${DOCTL_VERSION}/doctl-${DOCTL_VERSION}-linux-amd64.tar.gz" && tar xf doctl.tar.gz
  - chmod u+x doctl
  - mv doctl /usr/local/bin/doctl

unit-tests:
  stage: test
  image: python:3.14-slim
  before_script:
    - pip install --no-cache-dir -r requirements.txt
  script:
    - python -m pytest tests/unit --cov --cov-report term --cov-report xml:coverage.xml --junitxml=unit_result.xml
  coverage: /TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: unit_result.xml

integration-tests:
  stage: test
  image: ubuntu:24.04
  variables:
    TESTCONTAINERS_PULL_TIMEOUT: 300
    TESTCONTAINERS_TIMEOUT: 300
  retry: 1
  services:
    - "docker:${DOCKER_EXECUTOR_VERSION}-dind"
  before_script:
    - *python_setup
    - *docker_setup
    - python -m venv ci
    - source ci/bin/activate
    - pip install --no-cache-dir -r requirements.txt
  script:
    - python -m pytest tests/integration --junitxml=int_result.xml
  artifacts:
    reports:
      junit: int_result.xml

scan-reporting:
  stage: test
  needs:
    - semgrep-sast
  image: ubuntu:24.04
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
  before_script:
    - *python_setup
    - apt-get install -y python3-jinja2
  script:
    - python pipeline/sast_report.py > comment.json
    - echo "Sending to $CI_SERVER_URL/api/v4/projects/$CI_MERGE_REQUEST_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes"
    - |
      curl --location \
      --request POST \
      "$CI_SERVER_URL/api/v4/projects/$CI_MERGE_REQUEST_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes" \
      --header "PRIVATE-TOKEN: $SCANNER_ACCESS_TOKEN" \
      --header "Content-Type: application/json" \
      --data @comment.json
  
setup-buildenv:
  stage: build
  artifacts:
    reports:
      dotenv: build.env
  script:
    - export VERSION=$(sh generate_version.sh)
    - echo "VERSION=${VERSION}" > build.env && source build.env

build-container:
  stage: build
  image: "docker:${DOCKER_EXECUTOR_VERSION}-cli"
  services:
    - "docker:${DOCKER_EXECUTOR_VERSION}-dind"
  needs: 
    - setup-buildenv
  before_script:
    - docker system prune -f
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - export CONTAINER_IMAGE_LATEST="$CI_REGISTRY_IMAGE:latest"
    - export CONTAINER_IMAGE="$CI_REGISTRY_IMAGE:$VERSION"
    - export CONTAINER_IMAGE_REF="$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
    - 'echo "Using Container Registry: $CI_REGISTRY"'
    - 'echo "Will build and push: $CONTAINER_IMAGE"'
  script:
    - sh generate_version.sh
    - docker build --pull -t $CONTAINER_IMAGE_LATEST -f Containerfile .
    - docker tag $CONTAINER_IMAGE_LATEST "$CONTAINER_IMAGE"
    - docker tag $CONTAINER_IMAGE_LATEST "$CONTAINER_IMAGE_REF"
    - docker push $CONTAINER_IMAGE
    - docker push $CONTAINER_IMAGE_LATEST
    - if [ "$CI_COMMIT_REF_SLUG" = "main" ]; then docker push $CONTAINER_IMAGE_REF; fi

publish-container:
  stage: publish
  image: "docker:${DOCKER_EXECUTOR_VERSION}-cli"
  services:
    - "docker:${DOCKER_EXECUTOR_VERSION}-dind"
  needs:
    - setup-buildenv
    - build-container
  rules:
    ## Only tagged commits
    - if: $CI_COMMIT_TAG =~ /^v?[0-9]+[.][0-9]+([.][0-9]+)?$/
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - echo "$DOCKER_HUB_PASSWORD" | docker login -u $DOCKER_HUB_USERNAME --password-stdin
    - export INTERNAL_IMAGE="$CI_REGISTRY_IMAGE:$VERSION"
    - export PUBLIC_IMAGE="veritas1000/forgesteel-warehouse:$VERSION"
    - export PUBLIC_LATEST="veritas1000/forgesteel-warehouse:latest"
    - 'echo "Using Container Registry: $CI_REGISTRY"'
    - 'echo "Will push: $PUBLIC_IMAGE"'
  script:
    - docker pull $INTERNAL_IMAGE
    - docker tag $INTERNAL_IMAGE $PUBLIC_LATEST
    - docker tag $INTERNAL_IMAGE $PUBLIC_IMAGE
    - docker push $PUBLIC_IMAGE
    - docker push $PUBLIC_LATEST

publish-to-docr:
  stage: publish
  image: "docker:${DOCKER_EXECUTOR_VERSION}-cli"
  services:
    - "docker:${DOCKER_EXECUTOR_VERSION}-dind"
  needs: 
    - setup-buildenv
    - build-container
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - apk --no-cache add curl
    - *doctl_setup
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - doctl registry login --expiry-seconds 600
    - export INTERNAL_IMAGE="$CI_REGISTRY_IMAGE:$VERSION"
    - export DOCR_IMAGE="registry.digitalocean.com/forgesteel-fork-test/forgesteel-warehouse:latest"
  script:
    - docker pull $INTERNAL_IMAGE
    - docker tag $INTERNAL_IMAGE $DOCR_IMAGE
    - docker push $DOCR_IMAGE

cleanup-docr:
  stage: publish
  image: ubuntu:24.04
  needs: 
    - publish-to-docr
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - apt-get update && apt-get upgrade -y && apt install -y curl jq
    - *doctl_setup
  script: |
    #!/bin/bash -e

    ## Adapted slightly from https://github.com/rehab834/Automatic-cleaning-up-of-DOCR-/blob/main/DOCR-clean-up.yaml
    set -o pipefail
    echo "=== Starting DOCR Cleanup ==="
    trap 'echo "ERROR: Cleanup failed at $(date)"; exit 1' ERR

    ##
    ## Build keeplist from running apps
    ##
    echo "Building list of digests to keep from running apps..."
    KEEP_DIGESTS=""
    echo "Fetching in-use image digests..."
    IN_USE_DIGESTS=$(doctl apps list --output json | \
        jq -r '.[] | .active_deployment.cause_details.docr_push.image_digest | select( . != null )')
    if [ -z "$IN_USE_DIGESTS" ]; then
        echo "No running images found in apps."
    else
        KEEP_DIGESTS=$(echo "$IN_USE_DIGESTS")
        echo "Successfully marked running image digests to keep."
    fi
    echo "Keep list build complete."

    ##
    ## Loop through each repository
    ##
    doctl registry repository list | tail -n +2 | awk '{print $1}' | while read -r repo; do
        echo "--- Processing repository: $repo ---"
        ## List all manifests and separate into two lists
        all_manifests=$(doctl registry repository list-manifests $repo --format Digest,UpdatedAt,Tags | tail -n +2)
        untagged_list=""
        tagged_list=""
        while read -r line; do
            [ -z "$line" ] && continue
            digest=$(echo $line | awk '{print $1}')
            updated_at=$(echo $line | awk '{print $6, $7, $8}')
            tags=$(echo $line | awk '{print $10}')
            timestamp=$(date -d "$updated_at" +%s)
            output_line="$timestamp|$digest|$updated_at"
            if [ "$tags" == "[]" ]; then
                untagged_list+="$output_line\n"
            else
                tagged_list+="$output_line\n"
            fi
        done <<< "$all_manifests"
        ## Process UNTAGGED images (Delete all, no checks)
        echo "Processing untagged images..."
        while read -r line; do
            [ -z "$line" ] && continue
            digest=$(echo $line | cut -d'|' -f2)
            updated_at=$(echo $line | cut -d'|' -f3)
            printf "Deleting (untagged): %s (updated at %s)\n" "$digest" "$updated_at"
            doctl registry repository delete-manifest $repo $digest --force
        done <<< "$(echo -e "$untagged_list")"
        ## Process TAGGED images
        echo "Processing tagged images..."
        keep_count=0
        while read -r line; do
            [ -z "$line" ] && continue
            keep_count=$((keep_count + 1))
            timestamp=$(echo $line | cut -d'|' -f1)
            digest=$(echo $line | cut -d'|' -f2)
            updated_at=$(echo $line | cut -d'|' -f3)
            ## Skip images currently running in cluster
            if [[ "$KEEP_DIGESTS" == *"$digest"* ]]; then
                printf "Keeping (in use): %s (updated at %s)\n" "$digest" "$updated_at"
                continue
            fi
            ## Always keep the 5 latest tagged images
            if [[ $keep_count -le 5 ]]; then
                printf "Keeping (newest %d/5): %s (updated at %s)\n" "$keep_count" "$digest" "$updated_at"
                continue
            fi
            ## Delete others
            printf "Deleting (tagged, older): %s (updated at %s)\n" "$digest" "$updated_at"
            doctl registry repository delete-manifest $repo $digest --force

        done <<< "$(echo -e "$tagged_list" | sort -rn)" # Sort tagged list newest first
        echo "Completed cleanup for repository: $repo"
    done
    echo "=== Running Garbage collection ==="
    doctl registry garbage-collection start -f
    echo "=== Registry cleanup finished successfully ==="
